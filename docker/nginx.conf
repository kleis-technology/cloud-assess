# Serve swagger-ui and the API on the same origin, so that "Try it out" needs no CORS.
#   /docs/  -> swagger-ui
#   /       -> cloud assess API (lcaac serve)
server {
    listen 80;

    client_max_body_size 50m;
    # relative redirects, so that they keep the host port
    absolute_redirect off;

    location = /docs {
        return 301 /docs/;
    }

    location /docs/ {
        proxy_pass http://swagger_ui:8080;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_read_timeout 600s;
    }
}
