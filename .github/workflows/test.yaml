name: Run Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - trusted_library/**
      - samples/**
      - tests/**
      - docker/**
      - Dockerfile
      - .github/workflows/test.yaml
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    env:
      IMAGE: cloud-assess-app:test
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE" .

      - name: Test the models
        run: docker run --rm --entrypoint lcaac "$IMAGE" test -c /trusted_library/lcaac.yaml -s /trusted_library/lib

      - name: Check the API definition
        run: docker run --rm --entrypoint lcaac "$IMAGE" api openapi -c /trusted_library/lcaac.yaml -s /trusted_library/lib > /dev/null

      - name: Start server
        run: |
          docker run -d --name cloud-assess -p 8080:8080 "$IMAGE"
          for i in $(seq 1 120); do
            curl -sf localhost:8080/health && exit 0
            sleep 1
          done
          echo "server did not start"
          exit 1

      - name: Smoke test the API
        run: python3 tests/smoke_test.py http://localhost:8080

      - name: Server logs
        if: always()
        run: docker logs cloud-assess || true
